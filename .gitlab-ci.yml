# Переменные CI/CD (Settings -> CI/CD -> Variables), masked:
#   REGISTRY           - docker-реестр с путём, без схемы: host[:port][/path]
#                        (YCR: cr.yandex/<registry_id>)
#   REGISTRY_USER      - логин (YCR с ключом сервисного аккаунта: json_key)
#   REGISTRY_PASSWORD  - пароль/токен (если подходит masked-переменная)
#   REGISTRY_PASSWORD_B64 - то же самое, но в base64 (для YCR: JSON-ключ сервисного
#                        аккаунта, REGISTRY_USER=json_key). Если задана, имеет приоритет.

stages:
  - test
  - build
  - deploy

variables:
  # SemVer: мажор.минор задаём вручную, патч = номер пайплайна
  VERSION_MAJOR_MINOR: "1.0"
  VERSION: "${VERSION_MAJOR_MINOR}.${CI_PIPELINE_IID}"
  CLUSTER_ID: "catfsljbv2qdf1i7t68s"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- test ----------
test-backend:
  stage: test
  image: golang:1.23-alpine
  script:
    - cd backend
    - go vet ./...
    - go test -v ./...

test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build   # тестов во фронте нет, сборка ловит ошибки TypeScript
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/node_modules/]

# Диагностика: достучится ли раннер до реестра (запуск вручную)
check-registry:
  stage: test
  image: curlimages/curl:8.10.1
  when: manual
  allow_failure: true
  script:
    - curl -sS -m 15 -o /dev/null -w "HTTP %{http_code}\n" "https://${REGISTRY%%/*}/v2/"

# ---------- build ----------
.kaniko:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      PASS="$REGISTRY_PASSWORD"
      if [ -n "$REGISTRY_PASSWORD_B64" ]; then PASS=$(printf '%s' "$REGISTRY_PASSWORD_B64" | base64 -d); fi
      AUTH=$(printf '%s:%s' "$REGISTRY_USER" "$PASS" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "${REGISTRY%%/*}" "$AUTH" > /kaniko/.docker/config.json

build-backend:
  extends: .kaniko
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${REGISTRY}/momo-backend:${VERSION}"

build-frontend:
  extends: .kaniko
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/frontend"
      --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile"
      --destination "${REGISTRY}/momo-frontend:${VERSION}"

# ---------- deploy ----------
deploy:
  stage: deploy
  image: alpine:3.20
  needs: [build-backend, build-frontend]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add --no-cache bash curl helm kubectl
    - YC_VER=$(curl -sS https://storage.yandexcloud.net/yandexcloud-yc/release/stable)
    - curl -sSL "https://storage.yandexcloud.net/yandexcloud-yc/release/${YC_VER}/linux/amd64/yc" -o /usr/local/bin/yc
    - chmod +x /usr/local/bin/yc
    - printf '%s' "$REGISTRY_PASSWORD_B64" | base64 -d > /tmp/key.json
    - yc config set service-account-key /tmp/key.json
    - yc managed-kubernetes cluster get-credentials --id "$CLUSTER_ID" --external
    - >
      helm upgrade --install momo charts/momo-store
      -n momo --create-namespace --atomic --timeout 5m
      --set backend.image.repository=${REGISTRY}/momo-backend
      --set backend.image.tag=${VERSION}
      --set frontend.image.repository=${REGISTRY}/momo-frontend
      --set frontend.image.tag=${VERSION}
      --set frontend.service.type=LoadBalancer
      --set ingress.enabled=false
    - kubectl -n momo get pods,svc

# ---------- deploy monitoring ----------
deploy-monitoring:
  stage: deploy
  image: alpine:3.20
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - apk add --no-cache bash curl helm kubectl
    - YC_VER=$(curl -sS https://storage.yandexcloud.net/yandexcloud-yc/release/stable)
    - curl -sSL "https://storage.yandexcloud.net/yandexcloud-yc/release/${YC_VER}/linux/amd64/yc" -o /usr/local/bin/yc
    - chmod +x /usr/local/bin/yc
    - printf '%s' "$REGISTRY_PASSWORD_B64" | base64 -d > /tmp/key.json
    - yc config set service-account-key /tmp/key.json
    - yc managed-kubernetes cluster get-credentials --id "$CLUSTER_ID" --external
    - >
      helm upgrade --install monitoring charts/monitoring
      -n monitoring --create-namespace --atomic --timeout 5m
      --set grafana.adminPassword="$GRAFANA_ADMIN_PASSWORD"
    - kubectl -n monitoring get pods,svc
